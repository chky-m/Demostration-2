<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 4.1 - SVG house</title><link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="site-header"><div class="wrap"><p class="eyebrow">Exercise 4.1</p><h1>SVG house and garden</h1><nav aria-label="Main navigation"><a href="index.html">Home</a><a aria-current="page" href="svg-house.html">SVG house</a><a href="bar-chart.html">Bar chart</a><a href="multi-chart.html">Multi-chart</a><a href="interactive.html">Interactivity</a></nav></div></header>
  <main class="wrap">
    <p>The drawing is made from SVG shapes. The windows share one <code>&lt;g&gt;</code> group, so their fill and outline can be changed together. Their position comes from <code>translate(315 305)</code>.</p>
    <section class="panel"><h2>Customised drawing</h2>
      <svg id="house" viewBox="0 0 900 650" role="img" aria-label="Customised house with a roof, chimney, windows, garden bushes and path">
        <rect width="900" height="650" fill="#e7f4fd"/>
        <rect y="490" width="900" height="160" fill="#a9d794"/>
        <circle cx="750" cy="120" r="49" fill="#ffe18b"/>
        <rect x="278" y="250" width="370" height="270" rx="5" fill="#f0c99f" stroke="#604c43" stroke-width="4"/>
        <path d="M240 260 L463 95 L685 260 Z" fill="#bd554a" stroke="#604c43" stroke-width="4"/>
        <rect x="557" y="144" width="48" height="89" fill="#985047" stroke="#604c43" stroke-width="3"/>
        <rect x="422" y="380" width="82" height="140" fill="#6d5a4f" stroke="#463a35" stroke-width="3"/>
        <circle cx="491" cy="452" r="5" fill="#f5df91"/>
        <g id="windows" transform="translate(315 305)" fill="#c7e8fa" stroke="#604c43" stroke-width="5">
          <rect x="0" y="0" width="76" height="76"/>
          <rect x="240" y="0" width="76" height="76"/>
        </g>
        <path d="M421 520 C390 557 380 594 355 650 L570 650 C550 596 526 550 505 520 Z" fill="#d5bfa0"/>
        <ellipse cx="150" cy="495" rx="83" ry="42" fill="#4c9665"/>
        <ellipse cx="756" cy="502" rx="80" ry="38" fill="#4c9665"/>
        <line x1="46" y1="545" x2="260" y2="545" stroke="#6c8c5c" stroke-width="5"/>
        <text x="36" y="54" font-family="Arial, sans-serif" font-size="28" fill="#23435a">A house in the garden</text>
      </svg>
    </section>
  </main>
</body>
</html>
